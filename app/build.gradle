plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taro.atmosphereplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.taro.atmosphereplayer'
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName '0.3.12'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
